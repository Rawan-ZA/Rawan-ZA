<svg width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="0.2" cy="0.5" r="1">
      <stop offset="0" stop-color="#1a2146"/>
      <stop offset="1" stop-color="#070a14"/>
    </radialGradient>
    <radialGradient id="core" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#4338ca"/>
    </radialGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="streak" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="46" y2="-18">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="r"><rect width="800" height="220" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#r)">
    <rect width="800" height="220" fill="url(#bg)"/>

    <!-- Twinkling stars -->
    <g fill="#ffffff">
      <circle cx="40" cy="26" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="18" cy="130" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="270" cy="24" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="262" cy="196" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="14" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="770" cy="36" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="784" cy="120" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="208" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="10" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="740" cy="204" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Shooting stars (head leads down-left, tail trails up-right) -->
    <g opacity="0">
      <animateTransform attributeName="transform" type="translate" values="760,10;760,10;520,110;520,110" keyTimes="0;0.08;0.2;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.08;0.11;0.2;1" dur="9s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="46" y2="-18" stroke="url(#streak)" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g opacity="0">
      <animateTransform attributeName="transform" type="translate" values="420,8;420,8;220,90;220,90" keyTimes="0;0.1;0.22;1" dur="13s" begin="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.1;0.13;0.22;1" dur="13s" begin="5s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="46" y2="-18" stroke="url(#streak)" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- LEFT: orbit system, centred at (135,110) -->
    <g fill="none" stroke="#3a4170" stroke-width="1" stroke-dasharray="3 5">
      <circle cx="135" cy="110" r="34"/>
      <circle cx="135" cy="110" r="56"/>
      <circle cx="135" cy="110" r="78"/>
      <circle cx="135" cy="110" r="96"/>
    </g>
    <!-- Core: cloud + code brackets (cloud engineer / developer) -->
    <circle cx="135" cy="110" r="25" fill="url(#core)"/>
    <g transform="translate(135,110) scale(1.05) translate(-600,-155)">
      <path d="M585 170 a9 9 0 0 1 3 -17 a12 12 0 0 1 23 -3 a10 10 0 0 1 3 20 z" fill="#ffffff" fill-opacity="0.95"/>
    </g>
    <text x="135" y="118" text-anchor="middle" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="9.5" font-weight="700" fill="#4338ca">&lt;/&gt;</text>

    <!-- Planets: Node.js, WordPress, Terraform, AWS -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 135 110" to="360 135 110" dur="6s" repeatCount="indefinite"/>
      <circle cx="169" cy="110" r="5" fill="#6cc24a"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="90 135 110" to="450 135 110" dur="9s" repeatCount="indefinite"/>
      <circle cx="191" cy="110" r="6" fill="#6c8cff"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180 135 110" to="540 135 110" dur="13s" repeatCount="indefinite"/>
      <circle cx="213" cy="110" r="7" fill="#9d6bdc"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="270 135 110" to="630 135 110" dur="18s" repeatCount="indefinite"/>
      <circle cx="231" cy="110" r="8" fill="#FF9900"/>
    </g>

    <!-- RIGHT: name, role, pipeline (block centred at x=520) -->
    <text x="520" y="66" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="url(#tg)">Rawan Azzam</text>
    <text x="520" y="92" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9aa4c7">WordPress &amp; Node.js Developer  &#8226;  Cloud Engineer</text>

    <!-- Pipeline line: nodes at x = 340, 460, 580, 700 -->
    <line x1="340" y1="150" x2="700" y2="150" stroke="#3a4170" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- Pulse rings fired as the packet arrives (4.5s loop, 1.5s per hop) -->
    <circle cx="340" cy="150" r="20" fill="none" stroke="#6c8cff" stroke-width="2" opacity="0">
      <animate attributeName="r" values="20;34;34" keyTimes="0;0.35;1" dur="4.5s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0" keyTimes="0;0.35;1" dur="4.5s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="460" cy="150" r="20" fill="none" stroke="#6cc24a" stroke-width="2" opacity="0">
      <animate attributeName="r" values="20;34;34" keyTimes="0;0.35;1" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0" keyTimes="0;0.35;1" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="580" cy="150" r="20" fill="none" stroke="#9d6bdc" stroke-width="2" opacity="0">
      <animate attributeName="r" values="20;34;34" keyTimes="0;0.35;1" dur="4.5s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0" keyTimes="0;0.35;1" dur="4.5s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="150" r="20" fill="none" stroke="#FF9900" stroke-width="2" opacity="0">
      <animate attributeName="r" values="20;34;34" keyTimes="0;0.35;1" dur="4.5s" begin="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0" keyTimes="0;0.35;1" dur="4.5s" begin="4.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Node 1: WordPress -->
    <g transform="translate(340,150)">
      <rect x="-16" y="-14" width="32" height="28" rx="4" fill="#6c8cff" fill-opacity="0.15" stroke="#6c8cff" stroke-width="2"/>
      <line x1="-16" y1="-6" x2="16" y2="-6" stroke="#6c8cff" stroke-width="1.5"/>
      <circle cx="-10" cy="-10" r="1.5" fill="#6c8cff"/>
      <circle cx="-5" cy="-10" r="1.5" fill="#6c8cff"/>
      <circle cx="0" cy="-10" r="1.5" fill="#6c8cff"/>
      <text x="0" y="10" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#6c8cff">W</text>
    </g>
    <text x="340" y="192" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b93b8">WordPress</text>

    <!-- Node 2: Node.js -->
    <g transform="translate(460,150)">
      <polygon points="0,-19 16.5,-9.5 16.5,9.5 0,19 -16.5,9.5 -16.5,-9.5" fill="#6cc24a" fill-opacity="0.15" stroke="#6cc24a" stroke-width="2" stroke-linejoin="round"/>
      <text x="0" y="4" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#6cc24a">JS</text>
    </g>
    <text x="460" y="192" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b93b8">Node.js</text>

    <!-- Node 3: Terraform -->
    <g transform="translate(578,155)" fill="#9d6bdc" fill-opacity="0.25" stroke="#9d6bdc" stroke-width="1.5" stroke-linejoin="round">
      <polygon points="-15,-14 -5,-8 -5,4 -15,-2"/>
      <polygon points="-3,-7 7,-1 7,11 -3,5"/>
      <polygon points="-3,-21 7,-15 7,-3 -3,-9"/>
      <polygon points="9,-15 19,-9 19,3 9,-3"/>
    </g>
    <text x="580" y="192" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b93b8">Terraform</text>

    <!-- Node 4: AWS -->
    <g transform="translate(100,-8)">
      <path d="M585 170 a9 9 0 0 1 3 -17 a12 12 0 0 1 23 -3 a10 10 0 0 1 3 20 z" fill="#FF9900" fill-opacity="0.2" stroke="#FF9900" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <text x="700" y="192" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b93b8">AWS</text>

    <!-- Data packet: web -> backend -> infrastructure -> cloud -->
    <g>
      <circle r="9" fill="#3fb950" opacity="0.25"/>
      <circle r="4" fill="#3fb950"/>
      <animateMotion path="M340,150 L700,150" dur="4.5s" begin="0s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
