as,Menlo,monospace" xml:space="preserve" clip-path="url(#c1)"><tspan fill="#c084fc">resource </tspan><tspan fill="#a5e075">"engineer" "rawan" </tspan><tspan fill="#e8ecff">{</tspan></text><text x="50" y="140" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve" clip-path="url(#c2)"><tspan fill="#6c8cff">  title = </tspan><tspan fill="#a5e075">"Software Engineer"</tspan></text><text x="50" y="163" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve" clip-path="url(#c3)"><tspan fill="#6c8cff">  roles = </tspan><tspan fill="#a5e075">["WordPress Developer", "Node.js Developer", "Aspiring Cloud Engineer"]</tspan></text><text x="50" y="209" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve" clip-path="url(#c5)"><tspan fill="#6c8cff">  about = </tspan><tspan fill="#c084fc">&lt;&lt;-EOT</tspan></text><text x="50" y="232" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve" clip-path="url(#c6)"><tspan fill="#a5e075">    I'm a Software Engineer with hands-on experience in WordPress development</tspan></text><text x="50" y="255" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve" clip-path="url(#c7)"><tspan fill="#a5e075">    and backend development using Node.js. I enjoy building web applications,</tspan></text><text x="50" y="278" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve" clip-path="url(#c8)"><tspan fill="#a5e075">    customizing websites, and developing practical software solutions.</tspan></text><text x="50" y="301" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve" clip-path="url(#c9)"><tspan fill="#c084fc">  EOT</tspan></text><text x="50" y="347" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve" clip-path="url(#c11)"><tspan fill="#FF9900">  currently = </tspan><tspan fill="#c084fc">&lt;&lt;-EOT</tspan></text><text x="50" y="370" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve" clip-path="url(#c12)"><tspan fill="#FF9900">    Currently, I'm expanding my expertise in Cloud Computing and AWS,</tspan></text><text x="50" y="393" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve" clip-path="url(#c13)"><tspan fill="#FF9900">    strengthening my skills in cloud architecture, networking, security, and</tspan></text><text x="50" y="416" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve" clip-path="url(#c14)"><tspan fill="#FF9900">    scalability while preparing for the AWS Certified Solutions Architect –</tspan></text><text x="50" y="439" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve" clip-path="url(#c15)"><tspan fill="#FF9900">    Associate certification.</tspan></text><text x="50" y="462" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve" clip-path="url(#c16)"><tspan fill="#c084fc">  EOT</tspan></text><text x="50" y="485" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve" clip-path="url(#c17)"><tspan fill="#e8ecff">}</tspan></text><text x="50" y="508" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve" clip-path="url(#c18)"><tspan fill="#6cc24a">Plan: </tspan><tspan fill="#e8ecff">1 to add, 0 to change, 0 to destroy.</tspan></text><text x="50" y="531" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve" clip-path="url(#c19)"><tspan fill="#FF9900">▶ </tspan><tspan fill="#FF9900">AWS Certified Solutions Architect – Associate (SAA)</tspan><tspan fill="#fff">  →  PREPARING</tspan></text><g font-family="Consolas,Menlo,monospace" font-size="14" fill="#fff"><text x="616" y="531" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.33;.8;1" dur="1.4s" begin="5.0s" repeatCount="indefinite"/>.</text><text x="625" y="531" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.33;.8;1" dur="1.4s" begin="5.3s" repeatCount="indefi