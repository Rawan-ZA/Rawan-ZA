" rx="10" fill="#070b18" stroke="#2a3366"/><circle cx="52" cy="50" r="6" fill="#ff5f56"/><circle cx="72" cy="50" r="6" fill="#ffbd2e"/><circle cx="92" cy="50" r="6" fill="#27c93f"/><text x="400" y="54" font-size="12" fill="#8892b0" text-anchor="middle" font-family="Consolas,monospace">about.tf — rawan</text><text x="50" y="94" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve"><tspan fill="#8892b0">$ </tspan><tspan fill="#e8ecff">terraform plan -out=about-me</tspan></text><text x="50" y="117" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve"><tspan fill="#c084fc">resource </tspan><tspan fill="#a5e075">"engineer" "rawan" </tspan><tspan fill="#e8ecff">{</tspan></text><text x="50" y="140" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve"><tspan fill="#6c8cff">  title = </tspan><tspan fill="#a5e075">"Software Engineer"</tspan></text><text x="50" y="163" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve"><tspan fill="#6c8cff">  roles = </tspan><tspan fill="#a5e075">["WordPress Developer", "Node.js Developer", "Aspiring Cloud Engineer"]</tspan></text><text x="50" y="209" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve"><tspan fill="#6c8cff">  about = </tspan><tspan fill="#c084fc">&lt;&lt;-EOT</tspan></text><text x="50" y="232" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve"><tspan fill="#a5e075">    I'm a Software Engineer with hands-on experience in WordPress development</tspan></text><text x="50" y="255" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve"><tspan fill="#a5e075">    and backend development using Node.js. I enjoy building web applications,</tspan></text><text x="50" y="278" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve"><tspan fill="#a5e075">    customizing websites, and developing practical software solutions.</tspan></text><text x="50" y="301" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve"><tspan fill="#c084fc">  EOT</tspan></text><text x="50" y="347" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve"><tspan fill="#FF9900">  currently = </tspan><tspan fill="#c084fc">&lt;&lt;-EOT</tspan></text><text x="50" y="370" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve"><tspan fill="#FF9900">    Currently, I'm expanding my expertise in Cloud Computing and AWS,</tspan></text><text x="50" y="393" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve"><tspan fill="#FF9900">    strengthening my skills in cloud architecture, networking, security, and</tspan></text><text x="50" y="416" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve"><tspan fill="#FF9900">    scalability while preparing for the AWS Certified Solutions Architect –</tspan></text><text x="50" y="439" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve"><tspan fill="#FF9900">    Associate certification.</tspan></text><text x="50" y="462" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve"><tspan fill="#c084fc">  EOT</tspan></text><text x="50" y="485" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve"><tspan fill="#e8ecff">}</tspan></text><text x="50" y="508" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve"><tspan fill="#6cc24a">Plan: </tspan><tspan fill="#e8ecff">1 to add, 0 to change, 0 to destroy.</tspan></text><text x="50" y="531" font-size="14" font-family="Consolas,Menlo,monospace" xml:space="preserve"><tspan fill="#FF9900">▶ </tspan><tspan fill="#FF9900">AWS Certified Solutions Architect – Associate (SAA)</tspan><tspan fill="#fff">  →  PREPARING</tspan></text><rect x="50" y="77" width="0" height="25" fill="#070b18"><animate attributeName="x" values="50;50;770;770" keyTimes="0;0.0291;0.0569;1" dur="17.21s" begin="0s" fill="freeze"/><animate attribut