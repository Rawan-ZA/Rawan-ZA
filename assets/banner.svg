<svg width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1c1346"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <clipPath id="r"><rect width="800" height="220" rx="14"/></clipPath>
    <linearGradient id="streak" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="46" y2="-18">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#r)">
    <rect width="800" height="220" fill="url(#bg)"/>

    <!-- Twinkling stars -->
    <g fill="#ffffff">
      <circle cx="40" cy="26" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="30" cy="120" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="120" cy="204" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="230" cy="16" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="565" cy="14" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="36" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="784" cy="124" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="740" cy="206" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="212" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="210" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="3.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Shooting stars (head leads down-left, tail trails up-right) -->
    <g opacity="0">
      <animateTransform attributeName="transform" type="translate" values="760,10;760,10;520,110;520,110" keyTimes="0;0.08;0.2;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.08;0.11;0.2;1" dur="9s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="46" y2="-18" stroke="url(#streak)" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g opacity="0">
      <animateTransform attributeName="transform" type="translate" values="420,8;420,8;220,90;220,90" keyTimes="0;0.1;0.22;1" dur="13s" begin="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.1;0.13;0.22;1" dur="13s" begin="5s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="46" y2="-18" stroke="url(#streak)" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Title -->
    <text x="400" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="url(#tg)">Rawan Azzam</text>
 <text x="400" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#9aa4c7"> &#8226; Software Engineer  &#8226; WordPress  &amp; Node.js Developer  &#8226;   Cloud Engineer</text>
    <!-- Pipeline line: nodes at x = 175, 325, 475, 625 -->
    <line x1="175" y1="158" x2="625" y2="158" stroke="#3a4170" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- Pulse rings, one per node, fired as the packet arrives (4.5s loop, 1.5s per hop) -->
    <circle cx="175" cy="158" r="20" fill="none" stroke="#6c8cff" stroke-width="2" opacity="0">
      <animate attributeName="r" values="20;34;34" keyTimes="0;0.35;1" dur="4.5s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0" keyTimes="0;0.35;1" dur="4.5s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="325" cy="158" r="20" fill="none" stroke="#6cc24a" stroke-width="2" opacity="0">
      <animate attributeName="r" values="20;34;34" keyTimes="0;0.35;1" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0" keyTimes="0;0.35;1" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="475" cy="158" r="20" fill="none" stroke="#9d6bdc" stroke-width="2" opacity="0">
      <animate attributeName="r" values="20;34;34" keyTimes="0;0.35;1" dur="4.5s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0" keyTimes="0;0.35;1" dur="4.5s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="625" cy="158" r="20" fill="none" stroke="#FF9900" stroke-width="2" opacity="0">
      <animate attributeName="r" values="20;34;34" keyTimes="0;0.35;1" dur="4.5s" begin="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0" keyTimes="0;0.35;1" dur="4.5s" begin="4.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Node 1: WordPress (browser window) -->
    <g transform="translate(175,158)">
      <rect x="-16" y="-14" width="32" height="28" rx="4" fill="#6c8cff" fill-opacity="0.15" stroke="#6c8cff" stroke-width="2"/>
      <line x1="-16" y1="-6" x2="16" y2="-6" stroke="#6c8cff" stroke-width="1.5"/>
      <circle cx="-10" cy="-10" r="1.5" fill="#6c8cff"/>
      <circle cx="-5" cy="-10" r="1.5" fill="#6c8cff"/>
      <circle cx="0" cy="-10" r="1.5" fill="#6c8cff"/>
      <text x="0" y="10" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#6c8cff">W</text>
    </g>
    <text x="175" y="199" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b93b8">WordPress</text>

    <!-- Node 2: Node.js (hexagon) -->
    <g transform="translate(325,158)">
      <polygon points="0,-19 16.5,-9.5 16.5,9.5 0,19 -16.5,9.5 -16.5,-9.5" fill="#6cc24a" fill-opacity="0.15" stroke="#6cc24a" stroke-width="2" stroke-linejoin="round"/>
      <text x="0" y="4" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#6cc24a">JS</text>
    </g>
    <text x="325" y="199" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b93b8">Node.js</text>

    <!-- Node 3: Terraform (stacked blocks) -->
    <g transform="translate(473,163)" fill="#9d6bdc" fill-opacity="0.25" stroke="#9d6bdc" stroke-width="1.5" stroke-linejoin="round">
      <polygon points="-15,-14 -5,-8 -5,4 -15,-2"/>
      <polygon points="-3,-7 7,-1 7,11 -3,5"/>
      <polygon points="-3,-21 7,-15 7,-3 -3,-9"/>
      <polygon points="9,-15 19,-9 19,3 9,-3"/>
    </g>
    <text x="475" y="199" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b93b8">Terraform</text>

    <!-- Node 4: AWS (cloud) -->
    <g transform="translate(25,0)">
      <path d="M585 170 a9 9 0 0 1 3 -17 a12 12 0 0 1 23 -3 a10 10 0 0 1 3 20 z" fill="#FF9900" fill-opacity="0.2" stroke="#FF9900" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <text x="625" y="199" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b93b8">AWS</text>

    <!-- Data packet: code -> web -> backend -> infrastructure -> cloud -->
    <g>
      <circle r="9" fill="#3fb950" opacity="0.25"/>
      <circle r="4" fill="#3fb950"/>
      <animateMotion path="M175,158 L625,158" dur="4.5s" begin="0s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
